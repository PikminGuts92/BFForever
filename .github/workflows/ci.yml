on: [push, pull_request]

name: CI

jobs:
  build:
    name: Build (${{ matrix.osname }})
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          include:
            - os: macos-latest
              osname: "osx-x64"
            - os: ubuntu-latest
              osname: "linux-x64"
            - os: windows-latest
              osname: "win-x64"
    env:
      ZIP_NAME: ${{ github.event.repository.name }}-ci-${{ github.sha }}-${{ matrix.osname }}
      OUTPUT_PATH: ./build
    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test projects
        run: dotnet test
      - name: Publish applications
        shell: bash
        run: |
          dotnet publish ./Celt2Wav/Celt2Wav.csproj -c=Release --self-contained=false -r=${{ matrix.osname }} -o=${{ env.OUTPUT_PATH }}
          dotnet publish ./Rif2Mid/Rif2Mid.csproj -c=Release --self-contained=false -r=${{ matrix.osname }} -o=${{ env.OUTPUT_PATH }}
          dotnet publish ./SongFuseCLI/SongFuseCLI.csproj -c=Release --self-contained=false -r=${{ matrix.osname }} -o=${{ env.OUTPUT_PATH }}
      - name: Publish applications (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          dotnet publish ./RiffExplorer/RiffExplorer.csproj -c=Release --self-contained=false -r=${{ matrix.osname }} -o=${{ env.OUTPUT_PATH }}
          dotnet publish ./SongFuse/SongFuse.csproj -c=Release --self-contained=false -r=${{ matrix.osname }} -o=${{ env.OUTPUT_PATH }}
      - name: Cleanup debug files
        shell: bash
        run: |
          rm -f ${{ env.OUTPUT_PATH }}/*.config
          rm -f ${{ env.OUTPUT_PATH }}/*.pdb
          rm -f ${{ env.OUTPUT_PATH }}/*.dbg
          rm -rf ${{ env.OUTPUT_PATH }}/*.dsym
      - name: Copy readme and licenses
        shell: bash
        run: |
          cp -f ./LICENSE ${{ env.OUTPUT_PATH }}/LICENSE
          cp -f ./THIRDPARTY ${{ env.OUTPUT_PATH }}/THIRDPARTY
          cp -f ./README.md ${{ env.OUTPUT_PATH }}/README.md
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.OUTPUT_PATH }}
